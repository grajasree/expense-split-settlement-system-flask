{% extends "base.html" %}

{% block title %}Register - Expense Split and Settlement System{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <!-- Header / Brand -->
    <div class="auth-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>Create Account</h1>
      <p>Join Expense Split & Settlement System</p>
    </div>

    <!-- Controls (Theme & Language) -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
      <select id="language-select" class="lang-select" aria-label="Select Language">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="hi">हिन्दी (Hindi)</option>
      </select>
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Register Form -->
    <form action="{{ url_for('auth.register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="name" class="form-label" data-i18n="label_name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label" data-i18n="label_email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label" data-i18n="label_password">Password</label>
        <div class="input-password-wrapper">
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
          <button type="button" class="toggle-password" data-target="reg-password" title="Show or hide password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label" data-i18n="label_confirm_password">Confirm Password</label>
        <div class="input-password-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
          <button type="button" class="toggle-password" data-target="confirm_password" title="Show or hide password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
        <i class="fa-solid fa-check"></i>
        <span data-i18n="nav_register">Register</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
